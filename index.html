<!DOCTYPE html>
<html lang="es">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">

        Huellas de Caldas
      </a>
      <nav class="nav" aria-label="Menú principal">
        <a href="#inicio" data-menu="inicio">Inicio</a>
        <a href="#adopta" data-menu="adopta">Adopta</a>
        <a href="#donar">Cómo ayudar</a>
        <a class="btn b2" href="#donar"><svg width="16" height="16" style="color:#3B2A22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 14h2a2 2 0 0 0 0-4h-3c-.6 0-1.1.2-1.4.6L3 16"/><path d="m14.45 13.39 5.05-4.694C20.196 8 21 6.85 21 5.75a2.75 2.75 0 0 0-4.797-1.837.276.276 0 0 1-.406 0A2.75 2.75 0 0 0 11 5.75c0 1.2.802 2.248 1.5 2.946L16 11.95"/><path d="m2 15 6 6"/><path d="m7 20 1.6-1.4c.3-.4.8-.6 1.4-.6h4c1.1 0 2.1-.4 2.8-1.2l4.6-4.4a1 1 0 0 0-2.75-2.91"/></svg> Donar</a>

    </div>

  <main id="app">
    <noscript>
      <section class="sec"><div class="wrap"><p>Para ver los animales y enviar una solicitud, activa JavaScript en tu navegador o escríbenos a adopciones@huellasdecaldas.org.</p></div></section>
    </noscript>
  </main>

  <footer class="ft">
    <div class="wrap">
      <div>
        <div class="logo">
          <i><svg width="22" height="22" style="color:#3B2A22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="4" r="2"/><circle cx="18" cy="8" r="2"/><circle cx="20" cy="16" r="2"/><path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z"/></svg></i>

        <p>Rescatamos, cuidamos y buscamos hogar para perros y gatos de Manizales.</p>

      <div>

        <p><a href="mailto:adopciones@huellasdecaldas.org">adopciones@huellasdecaldas.org</a><br>310 456 7890<br>Manizales, Caldas</p>
